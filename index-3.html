<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Animals in the Dark | Reading & Listening</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#f7f7ff;background:#10142e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0%,#3e3973,#10142e 65%);min-height:100vh}.wrap{max-width:760px;margin:auto;padding:22px 16px 65px}header{text-align:center}h1{font-size:clamp(29px,7vw,45px);margin:9px 0}header p{color:#c8c9e8}.moon{font-size:52px}.tabs{display:flex;gap:7px;overflow:auto;padding:10px 0 18px}.tabs button{white-space:nowrap}.panel{background:#22284c;border:1px solid #515985;border-radius:20px;padding:21px;box-shadow:0 12px 30px #080b2480}button{border:0;border-radius:12px;padding:12px 15px;font-size:16px;font-weight:700;cursor:pointer;background:#ffd46b;color:#1e2444}button:focus-visible,input:focus-visible{outline:3px solid #fff}.tabs button{background:#363d67;color:white}.tabs button.active{background:#ffd46b;color:#161d3d}.muted{color:#c5c9e3}.sentence{font-size:clamp(20px,4vw,26px);line-height:1.55;padding:14px 0;border-bottom:1px solid #495076}.sentence:last-child{border:0}.zh{font-size:15px;color:#c5c9e3}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.small{font-size:13px;padding:8px 11px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.animal{text-align:center;background:#333b67;border-radius:15px;padding:17px 8px}.animal .emoji{font-size:54px}.animal strong{display:block;font-size:22px;margin:6px}.options{display:grid;gap:10px;margin-top:14px}.options button{background:#39446d;color:#fff;text-align:left}.options button.correct{background:#226a53}.options button.wrong{background:#883f53}.status{min-height:28px;margin:13px 0;font-weight:bold}.upload{display:block;margin:14px 0;padding:12px;border:1px dashed #8d96b6;border-radius:12px}.upload input{max-width:100%;margin-top:7px}.footer{font-size:13px;color:#b5bad9;text-align:center;margin-top:25px}.pill{background:#38446d;border-radius:20px;padding:5px 11px;font-size:13px}label{cursor:pointer}#question{font-size:23px;line-height:1.5}.hidden{display:none}</style></head><body><main class="wrap"><header><div class="moon">🌙 ✨</div><div class="pill" style="display:inline-block">Bricks Reading 50 · Nonfiction 2 · Unit 01</div><h1>Animals in the Dark</h1><p>夜間動物 · 英文閱讀與聽力練習</p></header><nav class="tabs" id="tabs"></nav><section id="panel" class="panel"></section><p class="footer">課文重點改寫練習版｜可在手機使用｜配音可自行上傳</p></main><script>
const lines=[['Most animals sleep at night.','大多數動物晚上睡覺。'],['But some are awake.','但是有些動物是醒著的。'],['Owls are awake at night.','貓頭鷹晚上醒著。'],['They hunt mice.','牠們捕捉老鼠。'],['Bats are awake at night.','蝙蝠晚上醒著。'],['They hunt moths.','牠們捕捉飛蛾。'],['Hedgehogs are awake at night.','刺蝟晚上醒著。'],['They hunt beetles.','牠們捕捉甲蟲。'],['Foxes are awake at night.','狐狸晚上醒著。'],['They hunt rabbits.','牠們捕捉兔子。'],['What do you do at night?','你晚上做什麼？']];
const animals=[['🦉','owl','貓頭鷹'],['🦇','bat','蝙蝠'],['🦔','hedgehog','刺蝟'],['🦊','fox','狐狸'],['🐭','mouse','老鼠'],['🦋','moth','飛蛾'],['🪲','beetle','甲蟲'],['🐰','rabbit','兔子']];
const quiz=[{q:'Listen and choose: What animal do you hear?',say:'hedgehog',opts:['owl','hedgehog','bat'],a:1},{q:'Listen and choose: What do bats hunt?',say:'Bats hunt moths.',opts:['Mice','Moths','Rabbits'],a:1},{q:'Listen and choose: What do foxes hunt?',say:'Foxes hunt rabbits.',opts:['Beetles','Moths','Rabbits'],a:2},{q:'When are owls awake?',say:'Owls are awake at night.',opts:['At night','In the morning','At noon'],a:0},{q:'What do hedgehogs hunt?',say:'Hedgehogs hunt beetles.',opts:['Rabbits','Beetles','Mice'],a:1}];
const tabs=['📖 Reading','🔊 Listen','🐾 Words','🎧 Quiz','⚙️ Voice'];let tab=0,idx=0,score=0,locked=false,slow=false,recordings={},audio=null,stopped=false;
const el=document.getElementById('panel');function stop(){stopped=true;speechSynthesis.cancel();if(audio){audio.pause();audio=null}}function say(text,done){speechSynthesis.cancel();if(recordings[text]){audio=new Audio(recordings[text]);audio.onended=()=>{audio=null;done?.()};audio.onerror=()=>{audio=null;native(text,done)};audio.play().catch(()=>native(text,done))}else native(text,done)}function native(text,done){if(!('speechSynthesis'in window)){alert('此瀏覽器不支援語音朗讀，請改用 Chrome 或上傳音檔。');return}const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=slow?0.72:0.88;u.pitch=1;const voices=speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang.startsWith('en-US')&&/natural|google|samantha|aria|jenny/i.test(v.name))||voices.find(v=>v.lang.startsWith('en-US'))||null;u.onend=()=>done?.();u.onerror=(e)=>{document.getElementById('voiceStatus').textContent='語音播放失敗：'+e.error+'。請確認手機已安裝 Google 語音服務，或改用 Chrome 開啟部署網址。';done?.()};speechSynthesis.resume();speechSynthesis.speak(u);setTimeout(()=>{if(speechSynthesis.paused)speechSynthesis.resume()},250)}function nav(n){stop();tab=n;idx=0;score=0;locked=false;render()}function render(){document.getElementById('tabs').innerHTML=tabs.map((x,i)=>`<button class="${tab===i?'active':''}" onclick="nav(${i})">${x}</button>`).join('');if(tab===0)el.innerHTML=`<h2>📖 Read the story</h2><p class="muted">點擊每句旁邊的喇叭，聆聽美式英文。</p>${lines.map(([en,zh])=>`<div class="sentence"><div class="row"><span style="flex:1">${en}</span><button class="small" onclick="say(${JSON.stringify(en)})" aria-label="朗讀">🔊</button></div><div class="zh">${zh}</div></div>`).join('')}`;if(tab===1)el.innerHTML=`<h2>🔊 Listen & Repeat</h2><p class="muted">每句朗讀完，停留 3 秒供學生跟讀。</p><p class="pill">第 ${idx+1} / ${lines.length} 句</p><div class="sentence">${lines[idx][0]}<p class="zh">${lines[idx][1]}</p></div><div class="row"><button onclick="playOne()">▶️ 播放本句</button><button onclick="playAll()">▶️ 全部跟讀</button><button onclick="stop()">⏹ 停止</button></div><p><label><input type="checkbox" ${slow?'checked':''} onchange="slow=this.checked"> 慢速朗讀</label></p><div class="row"><button onclick="idx=Math.max(0,idx-1);render()">上一句</button><button onclick="idx=Math.min(lines.length-1,idx+1);render()">下一句</button></div>`;if(tab===2)el.innerHTML=`<h2>🐾 Animal Words</h2><p class="muted">點圖片或喇叭聽單字。</p><div class="cards">${animals.map(([emoji,en,zh])=>`<div class="animal"><div class="emoji">${emoji}</div><strong>${en}</strong><div class="zh">${zh}</div><button class="small" style="margin-top:9px" onclick="say('${en}')">🔊 Listen</button></div>`).join('')}</div>`;if(tab===3)renderQuiz();if(tab===4)el.innerHTML=`<h2>⚙️ Voice settings</h2><p>預設使用裝置內建的美式英文語音。若希望更自然，可為課文句子上傳 MP3 或 M4A 錄音。</p><label><input type="checkbox" ${slow?'checked':''} onchange="slow=this.checked"> 慢速朗讀</label><p class="muted">選擇要替換的句子，再上傳對應音檔（只儲存在目前開啟的網頁，不會上傳到伺服器）。</p><select id="sentenceSelect" style="width:100%;padding:12px;border-radius:9px">${lines.map(([s],i)=>`<option value="${i}">${i+1}. ${s}</option>`).join('')}</select><label class="upload">選擇音檔 <input type="file" accept="audio/*" onchange="addAudio(this)"></label><p id="uploadStatus" class="muted">已載入 ${Object.keys(recordings).length} 段自訂音檔。</p><p class="muted">注意：重新整理網頁後需要重新選擇音檔。正式發布版可將音檔一起放進專案以永久保留。</p>`}
function playOne(){stop();stopped=false;say(lines[idx][0])}async function playAll(){stop();stopped=false;for(let i=idx;i<lines.length;i++){if(stopped)break;idx=i;render();await new Promise(resolve=>say(lines[i][0],resolve));if(stopped)break;await new Promise(resolve=>setTimeout(resolve,3000))}}function renderQuiz(){if(idx>=quiz.length){el.innerHTML=`<h2>🎉 Challenge Complete!</h2><h1>${score} / ${quiz.length}</h1><p>完成聽力挑戰！</p><button onclick="idx=0;score=0;locked=false;render()">再玩一次</button>`;return}const q=quiz[idx];el.innerHTML=`<h2>🎧 Listening Challenge</h2><p class="muted">第 ${idx+1} / ${quiz.length} 題 · 得分 ${score}</p><div id="question">${q.q}</div><p><button onclick="say(quiz[idx].say)">🔊 Play Audio</button></p><div class="options">${q.opts.map((o,i)=>`<button id="opt${i}" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div><div class="status" id="feedback" aria-live="polite"></div><button class="hidden" id="next" onclick="idx++;locked=false;render()">下一題 ➜</button>`}function answer(i){if(locked)return;locked=true;const q=quiz[idx];if(i===q.a)score++;document.getElementById('opt'+i).classList.add(i===q.a?'correct':'wrong');document.getElementById('opt'+q.a).classList.add('correct');document.getElementById('feedback').textContent=i===q.a?'✅ Great job!':'💡 正確答案：'+q.opts[q.a];document.getElementById('next').classList.remove('hidden')}function addAudio(input){const f=input.files[0];if(!f)return;const text=lines[Number(document.getElementById('sentenceSelect').value)][0];if(recordings[text])URL.revokeObjectURL(recordings[text]);recordings[text]=URL.createObjectURL(f);document.getElementById('uploadStatus').textContent='已載入 '+Object.keys(recordings).length+' 段音檔，包含：'+text}render();</script></body></html>
